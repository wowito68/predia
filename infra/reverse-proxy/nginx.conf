user nginx;
worker_processes auto;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format predia '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';

  access_log /var/log/nginx/access.log predia;
  error_log /var/log/nginx/error.log warn;

  limit_conn_zone $binary_remote_addr zone=predia_connections:10m;
  limit_req_zone $binary_remote_addr zone=predia_general:10m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=predia_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=predia_auth:10m rate=10r/m;
  limit_conn_status 429;
  limit_req_status 429;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  keepalive_requests 100;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  reset_timedout_connection on;
  server_tokens off;

  include /etc/nginx/conf.d/*.conf;
}
