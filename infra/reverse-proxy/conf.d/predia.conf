upstream predia_backend {
  least_conn;
  server predia-api-1:3000 max_fails=3 fail_timeout=10s;
  server predia-api-2:3000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

upstream predia_mobile {
  server predia-mobile-web:8080;
  keepalive 8;
}

server {
  listen 80;
  server_name prediaa.duckdns.org;

  if ($host != "prediaa.duckdns.org") {
    return 444;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name prediaa.duckdns.org;

  if ($host != "prediaa.duckdns.org") {
    return 444;
  }

  limit_conn predia_connections 30;

  ssl_certificate /etc/letsencrypt/live/predia/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/predia/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers on;
  ssl_ecdh_curve X25519:secp256r1;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

  client_max_body_size 8m;

  location = /api/metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://predia_backend;
  }

  location = /api/auth/login {
    limit_req zone=predia_auth burst=5 nodelay;
    proxy_pass http://predia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/auth/login-paciente {
    limit_req zone=predia_auth burst=5 nodelay;
    proxy_pass http://predia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/auth/refresh {
    limit_req zone=predia_auth burst=10 nodelay;
    proxy_pass http://predia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /api/ {
    limit_req zone=predia_api burst=40 nodelay;
    proxy_pass http://predia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
  }

  location = /mobile {
    return 301 /mobile/;
  }

  location /mobile/ {
    limit_req zone=predia_general burst=80 nodelay;
    proxy_pass http://predia_mobile/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /_expo/ {
    proxy_pass http://predia_mobile;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /assets/ {
    proxy_pass http://predia_mobile;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    limit_req zone=predia_general burst=80 nodelay;
    proxy_pass http://predia_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
  }
}
