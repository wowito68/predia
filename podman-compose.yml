services:
  diabetes-ai:
    build: .
    container_name: diabetes-ai-podman
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - predia-net-podman

  n8n:
    image: docker.io/n8nio/n8n:latest
    container_name: predia-n8n-podman
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
    volumes:
      - n8n_data_podman:/home/node/.n8n
    restart: unless-stopped
    networks:
      - predia-net-podman

networks:
  predia-net-podman:
    driver: bridge

volumes:
  n8n_data_podman:
    driver: local