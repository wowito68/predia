listen:
  port: 4040
  address: 0.0.0.0
  metrics_endpoint: /metrics

namespaces:
  - name: predia
    format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent $request_length "$http_referer" "$http_user_agent" upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time'
    source:
      syslog:
        listen_address: udp://0.0.0.0:8514
        format: rfc3164
        tags:
          - nginx
    histogram_buckets:
      - 0.01
      - 0.025
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1
      - 2.5
      - 5
      - 10
