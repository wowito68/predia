global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: predia-api
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - predia-api-1:3000
          - predia-api-2:3000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: nginx-logs
    static_configs:
      - targets:
          - nginxlog-exporter:4040

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://prediaa.duckdns.org/api/ready
          - https://prediaa.duckdns.org/mobile/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
