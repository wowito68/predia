x-logging: &predia-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  predia-proxy:
    image: nginx:1.27-alpine
    container_name: predia-proxy
    depends_on:
      predia-api-1:
        condition: service_healthy
      predia-api-2:
        condition: service_healthy
      predia-mobile-web:
        condition: service_healthy
      nginxlog-exporter:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "8080"
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/reverse-proxy/conf.d/predia.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    networks:
      - predia-public
      - predia-private
    logging: *predia-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header='Host: prediaa.duckdns.org' -qO- https://127.0.0.1/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  predia-api-1:
    image: predia-web:${PREDIA_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    container_name: predia-api-1
    env_file:
      - ${PREDIA_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PREDIA_INSTANCE_ID: predia-api-1
      PORT: 3000
    expose:
      - "3000"
    networks:
      - predia-private
    logging: *predia-logging
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  predia-api-2:
    image: predia-web:${PREDIA_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    container_name: predia-api-2
    env_file:
      - ${PREDIA_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PREDIA_INSTANCE_ID: predia-api-2
      PORT: 3000
    expose:
      - "3000"
    networks:
      - predia-private
    logging: *predia-logging
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  predia-mobile-web:
    image: predia-mobile-web:${PREDIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.mobile-web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?set EXPO_PUBLIC_API_URL}
    expose:
      - "8080"
    networks:
      - predia-private
    logging: *predia-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: predia-db-private
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-predia_db}
      MYSQL_USER: ${MYSQL_USER:-predia_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - predia_db_data_prod:/var/lib/mysql
    networks:
      - predia-private
    logging: *predia-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  predia-migrator:
    image: predia-migrator:${PREDIA_IMAGE_TAG:-latest}
    build:
      context: .
      target: migrator
    profiles:
      - tools
    env_file:
      - ${PREDIA_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    networks:
      - predia-private
    logging: *predia-logging
    depends_on:
      db:
        condition: service_healthy

  predia-seeder:
    image: predia-migrator:${PREDIA_IMAGE_TAG:-latest}
    build:
      context: .
      target: migrator
    profiles:
      - tools
    env_file:
      - ${PREDIA_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    command: ["pnpm", "--filter", "@predia/web", "exec", "tsx", "prisma/seed.ts"]
    networks:
      - predia-private
    logging: *predia-logging
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: predia-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - predia_prometheus_data:/prometheus
    networks:
      - predia-private
      - predia-monitoring
      - predia-admin
    logging: *predia-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: predia-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - predia_grafana_data:/var/lib/grafana
    networks:
      - predia-monitoring
      - predia-admin
    logging: *predia-logging
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: predia-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - predia-monitoring
    logging: *predia-logging
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: predia-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - predia-monitoring
    logging: *predia-logging
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    container_name: predia-mysql-exporter
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=predia_exporter"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD}
    networks:
      - predia-private
      - predia-monitoring
    logging: *predia-logging
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: predia-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://predia-proxy:8080/stub_status"
    networks:
      - predia-private
      - predia-monitoring
    logging: *predia-logging
    depends_on:
      predia-proxy:
        condition: service_healthy
    restart: unless-stopped

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    container_name: predia-nginxlog-exporter
    command:
      - "-config-file"
      - "/etc/nginxlog-exporter/config.yml"
    volumes:
      - ./monitoring/nginxlog-exporter.yml:/etc/nginxlog-exporter/config.yml:ro
    networks:
      - predia-private
      - predia-monitoring
    logging: *predia-logging
    restart: unless-stopped

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: predia-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - predia-monitoring
      - predia-admin
    logging: *predia-logging
    restart: unless-stopped

networks:
  predia-public:
    driver: bridge
  predia-private:
    driver: bridge
    internal: true
  predia-monitoring:
    driver: bridge
    internal: true
  predia-admin:
    driver: bridge

volumes:
  predia_db_data_prod:
  predia_prometheus_data:
  predia_grafana_data:
