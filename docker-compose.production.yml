services:
  predia-proxy:
    image: nginx:1.27-alpine
    container_name: predia-proxy
    depends_on:
      predia-api-1:
        condition: service_healthy
      predia-api-2:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - predia-public
      - predia-private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  predia-api-1:
    build: .
    container_name: predia-api-1
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PREDIA_INSTANCE_ID: predia-api-1
      PORT: 3000
    expose:
      - "3000"
    networks:
      - predia-private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  predia-api-2:
    build: .
    container_name: predia-api-2
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PREDIA_INSTANCE_ID: predia-api-2
      PORT: 3000
    expose:
      - "3000"
    networks:
      - predia-private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: predia-db-private
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-predia_db}
      MYSQL_USER: ${MYSQL_USER:-predia_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - predia_db_data_prod:/var/lib/mysql
    networks:
      - predia-private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  predia-migrator:
    image: node:20-alpine
    profiles:
      - tools
    working_dir: /workspace
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    command: >
      sh -lc "corepack enable &&
      corepack prepare pnpm@10.23.0 --activate &&
      pnpm install --frozen-lockfile --filter @predia/web --filter @predia/shared &&
      pnpm prisma:generate &&
      pnpm prisma:migrate:deploy"
    volumes:
      - .:/workspace:ro
      - predia_migrator_node_modules:/workspace/node_modules
      - predia_migrator_web_node_modules:/workspace/apps/web/node_modules
      - predia_migrator_shared_node_modules:/workspace/packages/shared/node_modules
    networks:
      - predia-private
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: predia-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - predia_prometheus_data:/prometheus
    networks:
      - predia-private
      - predia-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: predia-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - predia_grafana_data:/var/lib/grafana
    networks:
      - predia-monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: predia-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - predia-monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: predia-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - predia-monitoring
    restart: unless-stopped

networks:
  predia-public:
    driver: bridge
  predia-private:
    driver: bridge
    internal: true
  predia-monitoring:
    driver: bridge
    internal: true

volumes:
  predia_db_data_prod:
  predia_prometheus_data:
  predia_grafana_data:
  predia_migrator_node_modules:
  predia_migrator_web_node_modules:
  predia_migrator_shared_node_modules:
