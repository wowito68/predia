name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Prisma Types
        run: pnpm prisma generate

      - name: Run Tests
        run: pnpm run test

      - name: Build Project
        run: pnpm run build
        
  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd predia || cd /home/admin/predia
            git pull origin main
            
            # Reconstruir contenedores y levantar la aplicación
            sudo docker-compose up -d --build
            
            # Ejecutar migraciones en la de base de datos
            sudo docker exec diabetes-ai npx prisma db push --accept-data-loss || true
