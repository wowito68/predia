version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:20"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      ci-tooling:
        patterns:
          - eslint
          - "@eslint/*"
          - "typescript-eslint"
          - "typescript"
      web-runtime:
        patterns:
          - next
          - react
          - react-dom
          - postcss
      mobile-runtime:
        patterns:
          - expo
          - "expo-*"
          - react-native
